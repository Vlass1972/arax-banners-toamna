<style>
  :root{ --w:1085; --h:1450; }
  html,body{margin:0;height:100%;background:#0b1a33;overflow:hidden;}
  .viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  .stage{
    position:relative;flex:none;width:calc(var(--w) * 1px);height:calc(var(--h) * 1px);
    overflow:hidden;transform-origin:center center;background:#5aa9ff;
  }
  .layer{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;}
  img{display:block;user-select:none;-webkit-user-drag:none;}

  /* ---------- background: slow drift ---------- */
  .bg{ animation: bgZoom 18s ease-in-out infinite alternate; will-change:transform; }
  .bg img{width:100%;height:100%;object-fit:cover;}
  @keyframes bgZoom{ from{transform:scale(1.02) translateY(0)} to{transform:scale(1.08) translateY(-12px)} }

  /* floor rings under the girl: perspective ellipses, blue/lime pairs, expanding outward.
     Each pair is a plain box holding a static SVG, so its blur is painted once and the GPU only scales and fades the layer. */
  .pair{position:absolute;left:221px;top:1231px;width:750px;height:250px;   /* centred on the foot contact point 596,1356 */
    transform-origin:50% 50%;opacity:0;will-change:transform,opacity;
    animation: pairOut var(--dur) cubic-bezier(.12,.6,.4,1) var(--delay) infinite;}
  .pair svg{display:block;width:100%;height:100%;overflow:visible;}
  @keyframes pairOut{
    0%{transform:scale(.1);opacity:0}
    6%{opacity:1}
    25%{opacity:.85}
    50%{opacity:.45}
    72%{opacity:.12}
    82%{opacity:0}
    100%{transform:scale(1);opacity:0}
  }
  .pair ellipse{fill:none;stroke-linecap:round;}
  .pair.glow{mix-blend-mode:screen;}
  .pair.glow ellipse{opacity:.95;filter:url(#neon);stroke-width:26;}
  .pair.glow .g{stroke:#8ee81e}
  .pair.glow .b{stroke:#1e6cff}
  .pair.core .g{stroke:#e6ff5c;stroke-width:8}
  .pair.core .b{stroke:#7cc8ff;stroke-width:7}
  /* soft floor glow under the rings */
  .floorGlow{position:absolute;left:596px;top:1356px;width:700px;height:190px;transform:translate(-50%,-50%);
    background:radial-gradient(ellipse at center,rgba(90,190,255,.55),rgba(140,255,90,.25) 40%,rgba(0,0,0,0) 70%);
    mix-blend-mode:screen;opacity:.35;will-change:opacity;animation: glowPulse 3.2s ease-out 1.05s infinite;}
  @keyframes glowPulse{0%{opacity:1}45%{opacity:.4}90%{opacity:.45}100%{opacity:1}}

  /* ---------- falling leaves ---------- */
  .leaves{overflow:hidden;}
  .leaf{position:absolute;top:-80px;width:34px;height:34px;opacity:0;will-change:transform,opacity;}
  .leaf svg{width:100%;height:100%;animation:spin 3s ease-in-out infinite alternate;}
  @keyframes spin{from{transform:rotateY(0) rotate(-20deg)}to{transform:rotateY(180deg) rotate(25deg)}}

  /* ---------- cloud text ---------- */
  .cloudWrap{
    position:absolute;left:78px;top:24px;width:960px;
    animation: floatCloud 7s ease-in-out infinite;will-change:transform;
  }
  @keyframes floatCloud{ 0%,100%{transform:translateY(0) rotate(0)} 50%{transform:translateY(-10px) rotate(.3deg)} }
  .cloudWrap img{width:100%;height:auto;}

  /* cloud text: bursts out of the girl's fingertip, overshoots and springs back.
     Whole-image layers only; animated properties are transform and opacity. */
  .cloudStack{position:relative;top:-44px;width:100%;aspect-ratio:1085/1449;
    --ox:42.3%;--oy:45.4%;}                       /* fingertip, in % of this box */
  .cl{position:absolute;inset:0;transform-origin:var(--ox) var(--oy);will-change:transform,opacity;}
  .cl img{position:absolute;left:0;top:0;width:100%;height:auto;}

  /* 1. fog: a blurred copy erupts first, overshoots well past the letters and dissipates like a blast cloud */
  .fog{opacity:0;animation: fogBurst 1.35s 1.12s forwards;}
  .fog img{filter:blur(22px);}
  @keyframes fogBurst{
    0%  {opacity:0;transform:scale(.04) rotate(-12deg);animation-timing-function:cubic-bezier(.12,.75,.3,1)}
    32% {opacity:.95;transform:scale(1.04) rotate(1deg);animation-timing-function:cubic-bezier(.3,.2,.4,1)}
    100%{opacity:0;transform:scale(1.32) rotate(2deg)}
  }

  /* 2. sharp letters shoot out of the finger, overshoot, spring back */
  .sharp{opacity:0;animation: textBurst .85s 1.18s forwards;}
  @keyframes textBurst{
    0%  {opacity:0;transform:scale(.04) rotate(-12deg);animation-timing-function:cubic-bezier(.15,.8,.35,1)}
    22% {opacity:1}
    58% {opacity:1;transform:scale(1.11) rotate(1.6deg);animation-timing-function:cubic-bezier(.45,0,.55,1)}
    78% {transform:scale(.975) rotate(-.4deg);animation-timing-function:cubic-bezier(.45,0,.55,1)}
    100%{opacity:1;transform:scale(1) rotate(0)}
  }

  /* flash at the fingertip */
  .flash{position:absolute;left:var(--ox);top:var(--oy);width:260px;height:260px;margin:-130px 0 0 -130px;border-radius:50%;
    background:radial-gradient(circle,#fff 0%,rgba(255,255,255,.85) 18%,rgba(200,235,255,.35) 42%,rgba(255,255,255,0) 68%);
    opacity:0;pointer-events:none;will-change:transform,opacity;animation: flash .55s cubic-bezier(.2,.8,.3,1) 1.1s forwards;}
  @keyframes flash{0%{opacity:0;transform:scale(.15)}18%{opacity:1}100%{opacity:0;transform:scale(2.2)}}

  /* cloud bits flung out of the burst (motion: Web Animations API) */
  .bit{position:absolute;left:var(--ox);top:var(--oy);width:var(--s);height:var(--s);margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2);
    border-radius:50%;pointer-events:none;opacity:0;will-change:transform,opacity;
    background:radial-gradient(circle at 45% 40%,#fff 0%,rgba(255,255,255,.9) 30%,rgba(235,245,255,.45) 55%,rgba(255,255,255,0) 72%);}

  /* a few leaves shot out of the burst, then they tumble down (motion: Web Animations API) */
  .leafShot{position:absolute;left:var(--ox);top:var(--oy);width:var(--s);height:var(--s);margin:calc(var(--s) / -2) 0 0 calc(var(--s) / -2);
    opacity:0;pointer-events:none;will-change:transform,opacity;}
  .leafShot svg{width:100%;height:100%;display:block;}

  /* camera kick when the letters hit full size */
  .cam{position:absolute;inset:0;will-change:transform;animation: shake .5s linear 1.64s;}
  @keyframes shake{
    0%  {transform:translate(0,0)}
    12% {transform:translate(-8px,5px)}
    26% {transform:translate(7px,-6px)}
    40% {transform:translate(-5px,4px)}
    55% {transform:translate(4px,-3px)}
    70% {transform:translate(-2px,2px)}
    85% {transform:translate(1px,-1px)}
    100%{transform:translate(0,0)}
  }

  /* drifting puffs around the letters (motion: Web Animations API) */
  .puff{position:absolute;border-radius:50%;opacity:0;pointer-events:none;will-change:transform,opacity;
    background:radial-gradient(circle,rgba(255,255,255,.85) 0%,rgba(255,255,255,.5) 28%,rgba(240,248,255,.18) 50%,rgba(255,255,255,0) 70%);}

  /* ---------- girl ---------- */
  .girl{
    position:absolute;left:205px;top:535px;width:640px;
    transform-origin:50% 100%;
    opacity:0;
    will-change:transform,opacity;
    animation: girlIn .8s cubic-bezier(.2,.9,.25,1.25) .25s forwards, girlIdle 3.2s ease-in-out 1.05s infinite;
  }
  .girl img{width:100%;height:auto;filter:drop-shadow(0 30px 30px rgba(0,20,60,.35));}
  @keyframes girlIn{ from{opacity:0;transform:translateY(160px) scale(.9)} to{opacity:1;transform:translateY(6px) scale(1)} }
  @keyframes girlIdle{
    0%  {transform:translateY(6px) rotate(0)}          /* lowest point = ring spawn */
    50% {transform:translateY(-16px) rotate(-.5deg)}   /* apex */
    100%{transform:translateY(6px) rotate(0)}
  }

  /* light sparkle on the letters: a soft bar slides across, clipped to the letters by a static mask.

    -webkit-tap-highlight-color:transparent;opacity:0;
    animation: ctaIn .8s 2.6s forwards;}                          /* girl is at the top of her bounce here */
  @keyframes ctaIn{
    0%  {opacity:0;transform:translateX(-640px) skewX(-14deg);animation-timing-function:cubic-bezier(.15,.85,.3,1)}
    15% {opacity:1}
    68% {opacity:1;transform:translateX(18px) skewX(5deg);animation-timing-function:ease-in-out}
    100%{opacity:1;transform:translateX(0) skewX(0)}
  }
  .ctaHover{display:block;transition:transform .2s ease;}
  @media (hover:hover){ .cta:hover .ctaHover{transform:scale(1.04)} }
  /* pulse + glow in step with the girl's touch-down (same 3.2s beat as the floor rings), played by the script as
     short one-shot animations. The button has no will-change: between beats it is not a GPU layer, so its text is
     painted crisp instead of being a stretched bitmap at a fractional pixel offset. */
  .ctaPulse{display:block;position:relative;}
  .ctaGlow{position:absolute;inset:0;z-index:1;border-radius:999px;opacity:0;pointer-events:none;
    box-shadow:0 0 28px 8px rgba(220,255,70,.8),0 0 56px 16px rgba(110,210,255,.35);   /* outer shadow only: drawn over the button, never over the text */
    animation: ctaGlowOnce .7s ease-out 3.25s;}
  @keyframes ctaGlowOnce{0%{opacity:0}25%{opacity:.9}100%{opacity:0}}
  .ctaBody{position:relative;display:flex;align-items:center;gap:12px;height:92px;padding:0 26px 0 32px;border-radius:999px;
    background:linear-gradient(180deg,#f2ff80 0%,#d8f63e 52%,#bde424 100%);
    box-shadow:0 12px 24px rgba(8,36,84,.38),inset 0 2px 0 rgba(255,255,255,.75),inset 0 -4px 0 rgba(80,110,0,.22);
    color:#0b1a33;font:800 36px/1 Montserrat,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
    letter-spacing:-.01em;white-space:nowrap;}
  .ctaBody svg{flex:none;width:22px;height:30px;}
  .cta:focus{outline:none}
  .cta:focus-visible .ctaBody{outline:4px solid #fff;outline-offset:4px;}

  .stage.loading *{animation-play-state:paused!important}   /* everything waits for the images */

  /* the OS "reduce motion" setting is deliberately ignored: the animation always plays (owner's decision) */

  .cloudStack{top:-45.83px;--ox:67.71%;--oy:53.07%}
  .fog img{filter:blur(22.92px)}
  .flash{width:270.83px;height:270.83px;margin:-135.42px 0 0 -135.42px}

        <span class="ctaBody">Conectează-te acum<svg viewBox="0 0 22 30" aria-hidden="true"><path d="M5 4l11 11L5 26" fill="none" stroke="#0b1a33" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </span></span>
    </div>
   </div>
  </div>
</div>

<script>window.AD_CFG={"W":1085,"H":1808.33,"leaves":18,"burst":1.04,"stopAt":27,"debugParam":"__arax_t"};</script>
<script>
(function(){
  // fit stage to window
  const stage=document.getElementById('stage');
  const CFG=window.AD_CFG||{};                 // per-format settings injected by google/build.js (empty on the site)
  const W=CFG.W||1085,H=CFG.H||1450;
  const BS=CFG.burst||1;                         // scale for burst/puff distances and sizes
  // Fit the stage with CSS zoom where supported: the browser then lays out and rasterizes every layer at its real
  // on-screen size. With transform:scale() mobile Safari keeps layers at the full design size (x3 for the screen),
  // which runs out of graphics memory and leaves blank rectangles. transform:scale() stays as the fallback.
  const useZoom=!!(window.CSS&&CSS.supports&&CSS.supports('zoom','0.5'));
  function fit(){
    const s=Math.min(innerWidth/W,innerHeight/H);
    if(useZoom){stage.style.zoom=s;stage.style.transform='none';}
    else stage.style.transform='scale('+s+')';
  }
  addEventListener('resize',fit);fit();

  // Moving bits are driven by the Web Animations API with concrete numbers (no CSS variables inside keyframes),
  // so Safari can hand all of them to the GPU. They are started together with the CSS timeline below.
  const scripted=[];
  const queue=(el,keyframes,options,removeWhenDone)=>scripted.push([el,keyframes,options,removeWhenDone]);
  const rnd=(a,b)=>a+Math.random()*(b-a);
  const px=v=>v.toFixed(1)+'px';

  // leaves
  const leafSVG='<svg viewBox="0 0 100 100"><path fill="var(--c)" d="M50 5C52 18 56 24 62 28C66 20 72 16 80 14C76 22 76 30 78 36C86 34 94 36 98 42C90 46 86 52 86 58C80 56 74 58 70 62C76 68 78 74 76 82C68 78 60 78 54 82L52 97L48 97L46 82C40 78 32 78 24 82C22 74 24 68 30 62C26 58 20 56 14 58C14 52 10 46 2 42C6 36 14 34 22 36C24 30 24 22 20 14C28 16 34 20 38 28C44 24 48 18 50 5Z"/><path d="M50 12v84M50 40L64 30M50 40L36 30M50 58L74 50M50 58L26 50" stroke="rgba(110,45,0,.45)" stroke-width="2" fill="none"/></svg>';
  const leaves=document.getElementById('leaves');
  const cols=['#f0a12a','#e8762b','#d9541f','#f5c04a','#c8461a'];
  const FALL=H+110, LEAVES=CFG.leaves||34;
  for(let i=0;i<LEAVES;i++){
    const l=document.createElement('div');l.className='leaf';
    const sz=rnd(22,48), sway=rnd(-80,80);
    l.style.left=(Math.random()*100)+'%';
    l.style.width=l.style.height=sz+'px';
    l.style.setProperty('--c',cols[i%cols.length]);
    l.innerHTML=leafSVG;
    l.querySelector('svg').style.animationDuration=rnd(2,4)+'s';
    leaves.appendChild(l);
    queue(l,[
      {offset:0,   opacity:0,   transform:'translate(0px,0px) rotate(0deg)'},
      {offset:.06, opacity:.95},
      {offset:.5,  transform:'translate('+px(sway)+','+px(FALL/2)+') rotate(180deg)'},
      {offset:.92, opacity:.9},
      {offset:1,   opacity:0,   transform:'translate('+px(-sway*.6)+','+px(FALL)+') rotate(360deg)'}
    ],{duration:rnd(11,20)*1000*FALL/1560,delay:-rnd(0,20)*1000,iterations:Infinity});
  }

  // puffs around the text (positions in % of cloudWrap, roughly along letters and the swoosh)
  const puffs=document.getElementById('puffs');
  const spots=[[14,22],[26,16],[40,12],[56,10],[70,14],[20,42],[36,46],[50,40],[66,44],[82,30],[8,36],[60,54],[46,56],[30,55],[88,40],[76,50]];
  spots.forEach(p=>{
    const d=document.createElement('i');d.className='puff';
    const sz=rnd(90,210)*BS;
    d.style.left=p[0]+'%';d.style.top=p[1]+'%';
    d.style.width=d.style.height=sz+'px';
    puffs.appendChild(d);
    queue(d,[
      {offset:0,   opacity:0,   transform:'translate(0px,0px) scale(.6)',easing:'ease-in-out'},
      {offset:.25, opacity:.32, easing:'ease-in-out'},
      {offset:.6,  opacity:.22, easing:'ease-in-out'},
      {offset:1,   opacity:0,   transform:'translate('+px(rnd(-30,30)*BS)+','+px(-rnd(20,60)*BS)+') scale(1.25)'}
    ],{duration:rnd(5,10)*1000,delay:rnd(1.5,7.5)*1000,iterations:Infinity});
  });

  // burst from the fingertip: cloud bits and a handful of leaves
  const stack=document.getElementById('cloudStack');
  for(let i=0;i<16;i++){
    const b=document.createElement('i');b.className='bit';
    const ang=rnd(-200,20)*Math.PI/180, dist=rnd(160,480)*BS;
    b.style.setProperty('--s',Math.round(rnd(40,120)*BS)+'px');
    stack.appendChild(b);
    const ease='cubic-bezier(.08,.75,.3,1)';
    queue(b,[
      {offset:0,   opacity:0, transform:'translate(0px,0px) scale(.3)',easing:ease},
      {offset:.12, opacity:1, easing:ease},
      {offset:1,   opacity:0, transform:'translate('+px(Math.cos(ang)*dist)+','+px(Math.sin(ang)*dist)+') scale('+rnd(1.2,2).toFixed(2)+')'}
    ],{duration:rnd(.9,1.4)*1000,delay:(1.12+rnd(0,.1))*1000,fill:'forwards'},true);
  }
  for(let i=0;i<9;i++){
    const l=document.createElement('div');l.className='leafShot';
    const ang=rnd(-160,-20)*Math.PI/180, dist=rnd(180,380)*BS;
    const dx=Math.cos(ang)*dist, dy=Math.sin(ang)*dist, r=(Math.random()<.5?-1:1)*rnd(180,540);
    l.style.setProperty('--s',Math.round(rnd(26,44)*BS)+'px');
    l.style.setProperty('--c',cols[i%cols.length]);
    l.innerHTML=leafSVG;
    stack.appendChild(l);
    queue(l,[
      {offset:0,   opacity:0, transform:'translate(0px,0px) rotate(0deg) scale(.4)',easing:'cubic-bezier(.1,.8,.3,1)'},
      {offset:.08, opacity:1},
      {offset:.35, transform:'translate('+px(dx)+','+px(dy)+') rotate('+r.toFixed(0)+'deg) scale(1)',easing:'cubic-bezier(.4,0,.8,.6)'},
      {offset:.85, opacity:1},
      {offset:1,   opacity:0, transform:'translate('+px(dx*1.25)+','+px(dy+620*BS)+') rotate('+(r*3).toFixed(0)+'deg) scale(1)'}
    ],{duration:rnd(2.2,3)*1000,delay:(1.14+rnd(0,.08))*1000,fill:'forwards'},true);
  }

  // start the whole timeline only once the images are decoded
  const freezeAt=new URLSearchParams(location.search).get(CFG.debugParam||"t"); // debug: ?t=1.6 freezes the whole timeline (ad builds use an unusual name)
  const allImgs=[...document.querySelectorAll(".stage img")]
    .concat((CFG.preload||[]).map(src=>{const i=new Image();i.src=src;return i;}));   // e.g. mask images in ad builds
  const fontReady=document.fonts&&document.fonts.load
    ? Promise.race([document.fonts.load("800 36px Montserrat","Conectează-te acum"),new Promise(r=>setTimeout(r,1500))]).catch(()=>{})
    : Promise.resolve();
  Promise.all(allImgs.map(i=>i.decode().catch(()=>{})).concat(fontReady)).then(()=>{
    stage.classList.remove("loading");
    if(typeof Element.prototype.animate==='function')
      scripted.forEach(([el,keyframes,options,removeWhenDone])=>{
        const an=el.animate(keyframes,options);
        if(removeWhenDone)an.onfinish=()=>el.remove();   // burst bits are invisible once done: free their layers
      });
    // CTA beat: pulse + glow on each of the girl's touch-downs (girlIdle restarts there, every 3.2s from 4.25s),
    // so it stays on the rings' beat
    const SETTLE=1500;
    const pulse=stage.querySelector(".ctaPulse"), glow=stage.querySelector(".ctaGlow"), girl=stage.querySelector(".girl");
    const beatEnd=CFG.stopAt?CFG.stopAt*1000-SETTLE-100-830:Infinity;   // ad builds: no beat may still run when the frame settles
    if(typeof Element.prototype.animate==='function')girl.addEventListener("animationiteration",e=>{
      if(e.animationName!=="girlIdle"||(1.05+e.elapsedTime)*1000>beatEnd)return;
      pulse.animate([{transform:"scale(1)",easing:"ease-out"},{transform:"scale(1.06)",offset:.35,easing:"ease-out"},{transform:"scale(1)"}],{duration:830});
      glow.animate([{opacity:0,easing:"ease-out"},{opacity:1,offset:.16,easing:"ease-out"},{opacity:0}],{duration:1600});
    });
    if(freezeAt!==null)document.getAnimations().forEach(an=>{an.pause();an.currentTime=+freezeAt*1000;});
    // ad builds: everything holds still after CFG.stopAt seconds (Google Ads: animation must stop within 30s)
    // The loops first ease to their rest pose, so the last frame is not frozen mid-tilt or mid-zoom,
    // then the GPU layers are dropped: the browser repaints that frame at its real scale, crisp.
    else if(CFG.stopAt){
      setTimeout(()=>{
        [[".bg","transform"],[".cloudWrap","transform"],[".girl","transform"],[".ctaPulse","transform"],
         [".shine i","opacity"],[".ctaGlow","opacity"]].forEach(([sel,prop])=>{
          const el=stage.querySelector(sel);if(!el)return;
          const cur=getComputedStyle(el)[prop], rest=prop==="opacity"?"0":"none";
          el.getAnimations().forEach(an=>an.cancel());
          if(sel===".girl")el.style.opacity="1";        // girlIn no longer holds her visible
          el.style[prop]=rest;
          if(typeof el.animate==='function')el.animate([{[prop]:cur},{[prop]:rest}],{duration:SETTLE,easing:"ease-in-out"});
        });
      },CFG.stopAt*1000-SETTLE-100);
      setTimeout(()=>{
        document.getAnimations().forEach(an=>an.pause());
        [stage,...stage.querySelectorAll("*")].forEach(el=>{el.style.willChange="auto";});
      },CFG.stopAt*1000);
    }
  });
})();
</script>
