<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ARAX Google Ads</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#f4f5f7;--fg:#141821;--muted:#5d6472;--card:#fff;--line:#dfe2e8;--accent:#1f5fd6}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11141a;--fg:#e9ecf2;--muted:#9aa3b2;--card:#1a1f28;--line:#2a313d;--accent:#7fb0ff}}
  :root[data-theme="dark"]{--bg:#11141a;--fg:#e9ecf2;--muted:#9aa3b2;--card:#1a1f28;--line:#2a313d;--accent:#7fb0ff}
  html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
  main{max-width:900px;margin:0 auto;padding:24px 16px 48px}
  h1{font-size:20px;margin:0 0 4px}
  p.sub{margin:0 0 24px;color:var(--muted)}
  .row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .card h2{font-size:15px;margin:0 0 12px;display:flex;justify-content:space-between;gap:12px}
  .card h2 span{color:var(--muted);font-weight:400}
  iframe{display:block;border:0;background:#000}
  .actions{display:flex;gap:12px;margin-top:12px;font-size:14px}
  button{font:inherit;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
  a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1>ARAX toamna: Google Ads HTML5</h1>
  <p class="sub">Объявления в реальном размере. Анимация останавливается на 27-й секунде.</p>
  <div class="row">
    <div class="card">
      <h2>300×250 <span id="s300x250"></span></h2>
      <iframe id="f300x250" src="dist/300x250/index.html" width="300" height="250" title="300x250"></iframe>
      <div class="actions"><button data-f="f300x250">Повторить</button><a href="dist/arax-toamna-300x250.zip" download>Скачать ZIP</a></div>
    </div>
    <div class="card">
      <h2>300×600 <span id="s300x600"></span></h2>
      <iframe id="f300x600" src="dist/300x600/index.html" width="300" height="600" title="300x600"></iframe>
      <div class="actions"><button data-f="f300x600">Повторить</button><a href="dist/arax-toamna-300x600.zip" download>Скачать ZIP</a></div>
    </div>
  </div>
</main>
<script>
  document.querySelectorAll('button[data-f]').forEach(b=>b.addEventListener('click',()=>{const f=document.getElementById(b.dataset.f);f.src=f.src;}));
  fetch('dist/report.json').then(r=>r.json()).then(rep=>rep.forEach(x=>{const el=document.getElementById('s'+x.format);if(el)el.textContent='ZIP '+x.zip+(x.ok?'':' · есть замечания');})).catch(()=>{});
</script>
</body>
</html>
