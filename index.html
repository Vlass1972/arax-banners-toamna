<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<title>ARAX toamna</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{ --w:1085; --h:1450; }
  html,body{margin:0;height:100%;background:#0b1a33;overflow:hidden;}
  .viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  .stage{
    position:relative;flex:none;width:calc(var(--w) * 1px);height:calc(var(--h) * 1px);
    overflow:hidden;transform-origin:center center;background:#5aa9ff;
  }
  .layer{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;}
  img{display:block;user-select:none;-webkit-user-drag:none;}

  /* ---------- background: slow drift ---------- */
  .bg{ animation: bgZoom 18s ease-in-out infinite alternate; will-change:transform; }
  .bg img{width:100%;height:100%;object-fit:cover;}
  @keyframes bgZoom{ from{transform:scale(1.02) translateY(0)} to{transform:scale(1.08) translateY(-12px)} }

  /* floor rings under the girl: perspective ellipses, blue/lime pairs, expanding outward */
  .rings{position:absolute;left:0;top:0;width:1085px;height:1450px;overflow:visible;}
  .rings .pair{transform-box:view-box;transform-origin:596px 1356px;opacity:0;
    animation: pairOut var(--dur) cubic-bezier(.12,.6,.4,1) var(--delay) infinite;}
  @keyframes pairOut{
    0%{transform:scale(.1);opacity:0}
    6%{opacity:1}
    25%{opacity:.85}
    50%{opacity:.45}
    72%{opacity:.12}
    82%{opacity:0}
    100%{transform:scale(1);opacity:0}
  }
  .rings ellipse{fill:none;stroke-linecap:round;}
  .rings .glow{opacity:.95;filter:url(#neon);mix-blend-mode:screen;}
  .rings .core{stroke-width:7;}
  .rings .green .core{stroke:#e6ff5c;stroke-width:8}
  .rings .green .glow{stroke:#8ee81e;stroke-width:26}
  .rings .blue  .core{stroke:#7cc8ff}
  .rings .blue  .glow{stroke:#1e6cff;stroke-width:26}
  .rings .spin{animation: dashSpin var(--spin) linear infinite;}
  @keyframes dashSpin{to{stroke-dashoffset:-1200}}
  /* soft floor glow under the rings */
  .floorGlow{position:absolute;left:596px;top:1356px;width:700px;height:190px;transform:translate(-50%,-50%);
    background:radial-gradient(ellipse at center,rgba(90,190,255,.55),rgba(140,255,90,.25) 40%,rgba(0,0,0,0) 70%);
    mix-blend-mode:screen;opacity:.35;animation: glowPulse 3.2s ease-out 2.2s infinite;}
  @keyframes glowPulse{0%{opacity:1}45%{opacity:.4}90%{opacity:.45}100%{opacity:1}}

  /* ---------- falling leaves ---------- */
  .leaves{overflow:hidden;}
  .leaf{
    position:absolute;top:-80px;width:34px;height:34px;opacity:0;
    animation-name:fall;animation-timing-function:linear;animation-iteration-count:infinite;
  }
  .leaf svg{width:100%;height:100%;animation:spin 3s ease-in-out infinite alternate;}
  @keyframes fall{
    0%{transform:translate(0,0) rotate(0);opacity:0}
    6%{opacity:.95}
    50%{transform:translate(var(--sway),780px) rotate(180deg)}
    92%{opacity:.9}
    100%{transform:translate(calc(var(--sway) * -.6),1560px) rotate(360deg);opacity:0}
  }
  @keyframes spin{from{transform:rotateY(0) rotate(-20deg)}to{transform:rotateY(180deg) rotate(25deg)}}

  /* ---------- cloud text ---------- */
  .cloudWrap{
    position:absolute;left:78px;top:24px;width:960px;
    animation: floatCloud 7s ease-in-out infinite;
  }
  @keyframes floatCloud{ 0%,100%{transform:translateY(0) rotate(0)} 50%{transform:translateY(-10px) rotate(.3deg)} }
  .cloudWrap img{width:100%;height:auto;}

  /* cloud text: WebGL canvas, formation + boil computed in a fragment shader */
  .cloudStack{position:relative;top:-44px;width:100%;aspect-ratio:1085/1449;}
  .cloudGL{position:absolute;inset:0;width:100%;height:100%;display:block;}
  .cloudFallback{position:absolute;inset:0;width:100%;height:auto;opacity:0;
    -webkit-mask-image:linear-gradient(100deg,#000 0%,#000 30%,rgba(0,0,0,.6) 40%,transparent 55%);
            mask-image:linear-gradient(100deg,#000 0%,#000 30%,rgba(0,0,0,.6) 40%,transparent 55%);
    -webkit-mask-size:300% 100%;mask-size:300% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
    animation: fbReveal 2.6s cubic-bezier(.45,.05,.3,1) .5s forwards;}
  @keyframes fbReveal{0%{-webkit-mask-position:100% 0;mask-position:100% 0;opacity:0}8%{opacity:1}100%{-webkit-mask-position:0% 0;mask-position:0% 0;opacity:1}}

  /* drifting puffs around the letters */
  .puff{
    position:absolute;border-radius:50%;
    background:radial-gradient(circle at 45% 40%,rgba(255,255,255,.95),rgba(255,255,255,.55) 35%,rgba(210,230,255,0) 70%);
    filter:blur(14px);opacity:0;mix-blend-mode:screen;
    animation: puff var(--d) ease-in-out var(--delay) infinite;
  }
  @keyframes puff{
    0%{opacity:0;transform:translate(0,0) scale(.6)}
    25%{opacity:.32}
    60%{opacity:.22}
    100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.25)}
  }

  /* ---------- girl ---------- */
  .girl{
    position:absolute;left:205px;top:535px;width:640px;
    transform-origin:50% 100%;
    opacity:0;
    animation: girlIn 1.1s cubic-bezier(.2,.9,.25,1.25) 1.1s forwards, girlIdle 3.2s ease-in-out 2.2s infinite;
    filter:drop-shadow(0 30px 30px rgba(0,20,60,.35));
  }
  .girl img{width:100%;height:auto;}
  @keyframes girlIn{ from{opacity:0;transform:translateY(160px) scale(.9)} to{opacity:1;transform:translateY(6px) scale(1)} }
  @keyframes girlIdle{
    0%  {transform:translateY(6px) rotate(0)}          /* lowest point = ring spawn */
    50% {transform:translateY(-16px) rotate(-.5deg)}   /* apex */
    100%{transform:translateY(6px) rotate(0)}
  }

  /* light sparkle on the letters after they form */
  .shine{
    position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.55) 50%,transparent 60%);
    background-size:250% 100%;background-position:120% 0;
    mix-blend-mode:screen;opacity:0;
    -webkit-mask-image:url(assets/cloud.png);mask-image:url(assets/cloud.png);
    -webkit-mask-size:100% 100%;mask-size:100% 100%;
    animation: shine 6s ease-in-out 4.5s infinite;
  }
  @keyframes shine{ 0%{opacity:0;background-position:120% 0} 10%{opacity:1} 30%{opacity:0;background-position:-30% 0} 100%{opacity:0;background-position:-30% 0} }

  .stage.loading *{animation-play-state:paused!important}   /* everything waits for the images */

  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01s!important;animation-delay:0s!important}
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="neon" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
</svg>

<div class="viewport">
  <div class="stage loading" id="stage">
    <div class="layer bg"><img src="assets/bg.png" alt=""></div>

    <div class="layer">
      <div class="floorGlow"></div>
      <svg class="rings" viewBox="0 0 1085 1450" aria-hidden="true">
      <g class="pair" style="--delay:2.2s;--dur:6.4s">
        <g class="green">
          <ellipse class="glow spin" cx="596" cy="1356" rx="292" ry="74" stroke-dasharray="760 70 420 90" style="--spin:18s"/>
          <ellipse class="core spin" cx="596" cy="1356" rx="292" ry="74" stroke-dasharray="760 70 420 90" style="--spin:18s"/>
        </g>
        <g class="blue">
          <ellipse class="glow spin" cx="596" cy="1356" rx="335" ry="85" stroke-dasharray="900 60 500 75" style="--spin:18s;animation-direction:reverse"/>
          <ellipse class="core spin" cx="596" cy="1356" rx="335" ry="85" stroke-dasharray="900 60 500 75" style="--spin:18s;animation-direction:reverse"/>
        </g>
      </g>
      <g class="pair" style="--delay:5.4s;--dur:6.4s">
        <g class="green">
          <ellipse class="glow spin" cx="596" cy="1356" rx="292" ry="74" stroke-dasharray="760 70 420 90" style="--spin:22s"/>
          <ellipse class="core spin" cx="596" cy="1356" rx="292" ry="74" stroke-dasharray="760 70 420 90" style="--spin:22s"/>
        </g>
        <g class="blue">
          <ellipse class="glow spin" cx="596" cy="1356" rx="335" ry="85" stroke-dasharray="900 60 500 75" style="--spin:22s;animation-direction:reverse"/>
          <ellipse class="core spin" cx="596" cy="1356" rx="335" ry="85" stroke-dasharray="900 60 500 75" style="--spin:22s;animation-direction:reverse"/>
        </g>
      </g>
      </svg>
    </div>

    <div class="layer leaves" id="leaves"></div>

    <div class="cloudWrap">
      <div class="cloudStack" id="cloudStack">
        <div class="shine"></div>
      </div>
      <div class="puffs" id="puffs"></div>
    </div>

    <div class="girl"><img src="assets/girl.png" alt=""></div>
  </div>
</div>

<script src="assets/cloud-data.js"></script>
<script>
(function(){
  // fit stage to window
  const stage=document.getElementById('stage');
  const W=1085,H=1450;
  function fit(){
    const s=Math.min(innerWidth/W,innerHeight/H);
    stage.style.transform='scale('+s+')';
  }
  addEventListener('resize',fit);fit();

  // leaves
  const leafSVG='<svg viewBox="0 0 100 100"><path fill="var(--c)" d="M50 5C52 18 56 24 62 28C66 20 72 16 80 14C76 22 76 30 78 36C86 34 94 36 98 42C90 46 86 52 86 58C80 56 74 58 70 62C76 68 78 74 76 82C68 78 60 78 54 82L52 97L48 97L46 82C40 78 32 78 24 82C22 74 24 68 30 62C26 58 20 56 14 58C14 52 10 46 2 42C6 36 14 34 22 36C24 30 24 22 20 14C28 16 34 20 38 28C44 24 48 18 50 5Z"/><path d="M50 12v84M50 40L64 30M50 40L36 30M50 58L74 50M50 58L26 50" stroke="rgba(110,45,0,.45)" stroke-width="2" fill="none"/></svg>';
  const leaves=document.getElementById('leaves');
  const cols=['#f0a12a','#e8762b','#d9541f','#f5c04a','#c8461a'];
  for(let i=0;i<34;i++){
    const l=document.createElement('div');l.className='leaf';
    const sz=22+Math.random()*26;
    l.style.left=(Math.random()*100)+'%';
    l.style.width=l.style.height=sz+'px';
    l.style.setProperty('--sway',(Math.random()*160-80)+'px');
    l.style.setProperty('--c',cols[i%cols.length]);
    l.style.animationDuration=(11+Math.random()*9)+'s';
    l.style.animationDelay=(-Math.random()*20)+'s';
    l.innerHTML=leafSVG;
    l.querySelector('svg').style.animationDuration=(2+Math.random()*2)+'s';
    leaves.appendChild(l);
  }

  // puffs around the text (positions in % of cloudWrap, roughly along letters and the swoosh)
  const puffs=document.getElementById('puffs');
  const spots=[[14,22],[26,16],[40,12],[56,10],[70,14],[20,42],[36,46],[50,40],[66,44],[82,30],[8,36],[60,54],[46,56],[30,55],[88,40],[76,50]];
  spots.forEach((p,i)=>{
    const d=document.createElement('i');d.className='puff';
    const sz=90+Math.random()*120;
    d.style.left=p[0]+'%';d.style.top=p[1]+'%';
    d.style.width=d.style.height=sz+'px';
    d.style.setProperty('--dx',(Math.random()*60-30)+'px');
    d.style.setProperty('--dy',(-20-Math.random()*40)+'px');
    d.style.setProperty('--d',(5+Math.random()*5)+'s');
    d.style.setProperty('--delay',(1.5+Math.random()*6)+'s');
    puffs.appendChild(d);
  });

  // ================= cloud formation on WebGL =================
  const IW=1085,IH=1449,S=4,TMAX=4;            // image size, map downscale, seconds encoded in the map
  // regions in cloud.png pixels; wipe direction; start/end seconds (order and directions follow the reference video)
  const PARTS=[
    {poly:[[100,100],[100,480],[215,455],[285,440],[320,408],[400,398],[480,372],[560,366],[643,340],[710,332],[790,262],[790,100]],
      wipe:{type:"lin",angle:250}, t0:0.50, t1:1.45},
    {poly:[[790,100],[1085,100],[1085,760],[500,760],[500,690],[700,660],[880,615],[960,560],[1010,480],[1000,380],[960,300],[900,262],[790,262]],
      wipe:{type:"con",cx:560,cy:450,a0:44,a1:192}, t0:0.55, t1:2.55},
    {poly:[[225,453],[285,440],[320,408],[400,398],[480,372],[560,366],[612,350],[612,672],[500,692],[400,692],[300,683],[225,665]],
      wipe:{type:"lin",angle:0}, t0:1.30, t1:2.00},
    {poly:[[612,350],[643,340],[710,332],[790,262],[900,262],[960,300],[1000,380],[1010,480],[960,560],[880,615],[700,660],[612,672]],
      wipe:{type:"lin",angle:0}, t0:1.80, t1:2.45},
    {poly:[[0,480],[100,480],[215,455],[225,453],[225,665],[300,683],[400,692],[500,692],[500,760],[0,760]],
      wipe:{type:"lin",angle:90}, t0:2.20, t1:2.95},
  ];
  PARTS.forEach(p=>{
    if(p.wipe.type==="lin"){
      const a=p.wipe.angle*Math.PI/180;p.d=[Math.sin(a),-Math.cos(a)];
      const pr=p.poly.map(q=>q[0]*p.d[0]+q[1]*p.d[1]);p.pmin=Math.min(...pr);p.pmax=Math.max(...pr);
    }
  });
  function inPoly(x,y,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];
    if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c;}return c;}
  function boxBlur(src,w,h,r){ // separable box blur on float arrays
    const tmp=new Float32Array(w*h),out=new Float32Array(w*h);
    for(let y=0;y<h;y++){let acc=0;for(let x=-r;x<=r;x++)acc+=src[y*w+Math.min(w-1,Math.max(0,x))];
      for(let x=0;x<w;x++){tmp[y*w+x]=acc/(2*r+1);acc+=src[y*w+Math.min(w-1,x+r+1)]-src[y*w+Math.max(0,x-r)];}}
    for(let x=0;x<w;x++){let acc=0;for(let y=-r;y<=r;y++)acc+=tmp[Math.min(h-1,Math.max(0,y))*w+x];
      for(let y=0;y<h;y++){out[y*w+x]=acc/(2*r+1);acc+=tmp[Math.min(h-1,y+r+1)*w+x]-tmp[Math.max(0,y-r)*w+x];}}
    return out;
  }
  // per-pixel "appear at" seconds: wipe progress + stroke thickness (cores first, edges later) + noise, blurred across region seams
  function buildMap(img){
    const mw=Math.ceil(IW/S),mh=Math.ceil(IH/S);
    const oc=document.createElement("canvas");oc.width=mw;oc.height=mh;const ctx=oc.getContext("2d");
    ctx.drawImage(img,0,0,mw,mh);const px=ctx.getImageData(0,0,mw,mh).data;
    const alpha=new Float32Array(mw*mh);for(let i=0;i<mw*mh;i++)alpha[i]=px[i*4+3]/255;
    // chamfer distance (in low-res px) from each opaque pixel to the nearest transparent one: stroke cores are far, edges near
    const INF=1e4,dist=new Float32Array(mw*mh);
    for(let i=0;i<mw*mh;i++)dist[i]=alpha[i]>.5?INF:0;
    for(let y=0;y<mh;y++)for(let x=0;x<mw;x++){const i=y*mw+x;let d=dist[i];
      if(x>0)d=Math.min(d,dist[i-1]+1);if(y>0){d=Math.min(d,dist[i-mw]+1);if(x>0)d=Math.min(d,dist[i-mw-1]+1.414);if(x<mw-1)d=Math.min(d,dist[i-mw+1]+1.414);}dist[i]=d;}
    for(let y=mh-1;y>=0;y--)for(let x=mw-1;x>=0;x--){const i=y*mw+x;let d=dist[i];
      if(x<mw-1)d=Math.min(d,dist[i+1]+1);if(y<mh-1){d=Math.min(d,dist[i+mw]+1);if(x<mw-1)d=Math.min(d,dist[i+mw+1]+1.414);if(x>0)d=Math.min(d,dist[i+mw-1]+1.414);}dist[i]=d;}
    const gw=Math.ceil(mw/14)+1,gh=Math.ceil(mh/14)+1,grid=new Float32Array(gw*gh);for(let i=0;i<gw*gh;i++)grid[i]=Math.random();
    const noise=(x,y)=>{const gx=x/14,gy=y/14,x0=Math.floor(gx),y0=Math.floor(gy),fx=gx-x0,fy=gy-y0,g=(a,b)=>grid[Math.min(gh-1,b)*gw+Math.min(gw-1,a)];
      return (g(x0,y0)*(1-fx)+g(x0+1,y0)*fx)*(1-fy)+(g(x0,y0+1)*(1-fx)+g(x0+1,y0+1)*fx)*fy;};
    const T=new Float32Array(mw*mh);
    for(let y=0;y<mh;y++)for(let x=0;x<mw;x++){
      const X=(x+.5)*S,Y=(y+.5)*S;let t=3.4;
      for(const p of PARTS){ if(!inPoly(X,Y,p.poly))continue;
        let u;
        if(p.wipe.type==="lin"){u=(X*p.d[0]+Y*p.d[1]-p.pmin)/(p.pmax-p.pmin);}
        else{let ang=Math.atan2(X-p.wipe.cx,-(Y-p.wipe.cy))*180/Math.PI;if(ang<0)ang+=360;u=Math.min(1,Math.max(0,(ang-p.wipe.a0)/(p.wipe.a1-p.wipe.a0)));}
        const edge=1-Math.min(1,dist[y*mw+x]/9);               // 0 deep inside strokes, 1 at the outline (9 low-res px = 36px)
        const raw=u+edge*.6+(noise(x,y)-.5)*.22;
        t=p.t0+(p.t1-p.t0)*raw; break;
      }
      T[y*mw+x]=t;
    }
    const Tb=boxBlur(T,mw,mh,1);                             // soften seams between regions
    const out=new Uint8Array(mw*mh);for(let i=0;i<mw*mh;i++)out[i]=Math.max(0,Math.min(255,Math.round(Tb[i]/TMAX*255)));
    return {data:out,w:mw,h:mh};
  }
  const stackEl=document.getElementById("cloudStack");
  const canvas=document.createElement("canvas");canvas.width=IW;canvas.height=IH;canvas.className="cloudGL";
  stackEl.insertBefore(canvas,stackEl.firstChild);
  const gl=canvas.getContext("webgl",{premultipliedAlpha:true,alpha:true,antialias:false,depth:false,stencil:false});
  let drawCloud=null;
  const cloudImg=new Image();cloudImg.src=window.CLOUD_DATA||"assets/cloud.png"; // data URI keeps WebGL happy even when opened from disk
  const freezeAt=new URLSearchParams(location.search).get("t"); // debug: ?t=1.2 freezes the cloud timeline
  const useFallback=why=>{console.warn("cloud: fallback,",why);const im=document.createElement("img");im.src=cloudImg.src;im.className="cloudFallback";stackEl.insertBefore(im,stackEl.firstChild);canvas.remove();};
  cloudImg.onerror=()=>useFallback("image failed to load");
  cloudImg.onload=()=>{try{
    if(!gl||new URLSearchParams(location.search).has("nogl")) throw new Error("no WebGL");
    const vs="attribute vec2 p;varying vec2 v;void main(){gl_Position=vec4(p,0.,1.);v=vec2((p.x+1.)*.5,(1.-p.y)*.5);}";
    const fsrc=`precision mediump float;varying vec2 v;uniform sampler2D uCloud,uMap;uniform float uT,uTMax,uBoil;
      float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
      float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y);}
      void main(){
        vec2 uv=v;
        float n1=vn(uv*vec2(5.,6.7)+vec2(uT*.13,uT*.07));
        float n2=vn(uv*vec2(5.,6.7)+vec2(3.1,uT*.11)+2.);
        uv+=(vec2(n1,n2)-.5)*uBoil;                       /* gentle permanent boil */
        vec4 c=texture2D(uCloud,uv);
        float T=texture2D(uMap,uv).r*uTMax;
        float a=smoothstep(T,T+.07,uT);                   /* each pixel pops in at its own time, edge stays crisp */
        gl_FragColor=c*a;
      }`;
    const sh=(t,src)=>{const o=gl.createShader(t);gl.shaderSource(o,src);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o;};
    const prog=gl.createProgram();gl.attachShader(prog,sh(gl.VERTEX_SHADER,vs));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,fsrc));gl.linkProgram(prog);gl.useProgram(prog);
    const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
    const loc=gl.getAttribLocation(prog,"p");gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
    const tex=(unit,w,h,data,fmt)=>{const t=gl.createTexture();gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,t);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
      if(w===null){gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,data);}
      else{gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,false);gl.pixelStorei(gl.UNPACK_ALIGNMENT,1);gl.texImage2D(gl.TEXTURE_2D,0,fmt,w,h,0,fmt,gl.UNSIGNED_BYTE,data);}
      return t;};
    tex(0,null,null,cloudImg);
    const map=buildMap(cloudImg);tex(1,map.w,map.h,map.data,gl.LUMINANCE);
    gl.uniform1i(gl.getUniformLocation(prog,"uCloud"),0);gl.uniform1i(gl.getUniformLocation(prog,"uMap"),1);
    gl.uniform1f(gl.getUniformLocation(prog,"uTMax"),TMAX);
    const uT=gl.getUniformLocation(prog,"uT"),uBoil=gl.getUniformLocation(prog,"uBoil");
    gl.viewport(0,0,IW,IH);gl.clearColor(0,0,0,0);
    drawCloud=t=>{gl.clear(gl.COLOR_BUFFER_BIT);gl.uniform1f(uT,t);
      const settle=Math.min(1,Math.max(0,(t-.5)/2.6));
      gl.uniform1f(uBoil,.008+.012*(1-settle));gl.drawArrays(gl.TRIANGLE_STRIP,0,4);};
  }catch(e){useFallback(e&&e.message||e);}};
  // start the whole timeline (CSS + cloud) only once all images are decoded
  let t0=null;
  const allImgs=[...document.querySelectorAll(".stage img")].concat(cloudImg);
  Promise.all(allImgs.map(i=>i.decode().catch(()=>{}))).then(()=>{stage.classList.remove("loading");t0=performance.now();});
  function frame(now){
    requestAnimationFrame(frame);
    if(!drawCloud||t0===null)return;
    const t=freezeAt!==null?+freezeAt:(now-t0)/1000;
    drawCloud(t);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
